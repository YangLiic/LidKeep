name: macOS build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build universal app
        run: make app
      - name: Regression and read-only smoke checks
        run: make test
      - name: Package app
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LidKeep-build
          path: |
            dist/LidKeep-*.zip
            dist/LidKeep-*.dmg
            dist/SHA256SUMS
            dist/RELEASE-INFO.txt
          retention-days: 14
